name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run unit, API, playground, and quality tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Run static security scan
        run: npm run security:scan

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build production application
        run: npm run build

      - name: Check health endpoint contract
        run: npm run quality:health

      - name: Check Dockerfile release controls
        run: npm run quality:docker

      - name: Build production container
        run: docker build --tag zwa-presentations:quality .

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:e2e
